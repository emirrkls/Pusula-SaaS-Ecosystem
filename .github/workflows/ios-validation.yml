name: iOS Compile Gate

on:
  push:
    branches: [main]
    paths:
      - 'frontend-appstore/**'
      - '.github/workflows/ios-validation.yml'
  pull_request:
    paths:
      - 'frontend-appstore/**'
      - '.github/workflows/ios-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test notification routing and session-response policies
        run: swift test --package-path frontend-appstore
      - name: Compile app and UI test target for iOS Simulator
        run: >-
          xcodebuild -project frontend-appstore/PusulaService.xcodeproj
          -scheme PusulaService -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/pusula-derived CODE_SIGNING_ALLOWED=NO
          build-for-testing
