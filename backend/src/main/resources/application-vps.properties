spring.application.name=pusula-backend
app.deploy.version=${APP_DEPLOY_VERSION:vps}
app.business.timezone=${APP_BUSINESS_TIMEZONE:Europe/Istanbul}

# Server Configuration - Bind to all interfaces
server.address=0.0.0.0
server.port=8080

# Database Configuration (PostgreSQL on VPS)
# Update these values according to your VPS PostgreSQL setup
spring.datasource.url=jdbc:postgresql://localhost:5432/pusula_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.pusula=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO

# Google OAuth (Android sign in) — Web client ID is public; embedded in the Android app too.
google.oauth.web-client-id=${GOOGLE_WEB_CLIENT_ID:13892598501-51ks90qhkqke0qndtl2mdlinprr3njto.apps.googleusercontent.com}

# Google Play subscription verification
google.play.package-name=${GOOGLE_PLAY_PACKAGE_NAME:}
google.play.api-access-token=${GOOGLE_PLAY_API_ACCESS_TOKEN:}

# Apple App Store subscription verification
apple.app-store.bundle-id=${APPLE_APP_STORE_BUNDLE_ID:com.pusula.service}
apple.app-store.app-apple-id=${APPLE_APP_STORE_APP_APPLE_ID:}
apple.app-store.environments=${APPLE_APP_STORE_ENVIRONMENTS:SANDBOX,PRODUCTION}
apple.app-store.root-certificate-paths=${APPLE_APP_STORE_ROOT_CERTIFICATE_PATHS:}
apple.app-store.enable-online-checks=${APPLE_APP_STORE_ENABLE_ONLINE_CHECKS:true}

# Apple Push Notification service (APNs)
apple.push.enabled=${APPLE_PUSH_ENABLED:false}
apple.push.key-path=${APPLE_PUSH_KEY_PATH:}
apple.push.key-id=${APPLE_PUSH_KEY_ID:}
apple.push.team-id=${APPLE_PUSH_TEAM_ID:}
apple.push.bundle-id=${APPLE_PUSH_BUNDLE_ID:com.pusula.service}
apple.push.token-encryption-key=${PUSH_TOKEN_ENCRYPTION_KEY:}

# Iyzico webhook signature validation
iyzico.webhook.secret=${IYZICO_WEBHOOK_SECRET:}

# Desktop auto-update (MSI)
pusula.desktop.latest-version=3.2.26
pusula.desktop.download-url=https://api.pusulaiklimlendirme.com/downloads/Pusula-Servis-Yonetimi-3.2.26.msi
pusula.desktop.mandatory=false
pusula.desktop.release-notes=Teklif kalemleri gercek envantere baglandi; ozel teklif fiyati korundu; uzun notlar ve Windows guncelleme akisi duzeltildi.
