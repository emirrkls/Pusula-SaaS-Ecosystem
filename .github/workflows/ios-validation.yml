name: iOS Compile Gate

on:
  push:
    branches: [main]
    paths:
      - 'frontend-appstore/**'
      - '.github/workflows/ios-validation.yml'
      - 'scripts/test-ios-auth-contract.cjs'
      - 'scripts/test-ios-release-contract.cjs'
  pull_request:
    paths:
      - 'frontend-appstore/**'
      - '.github/workflows/ios-validation.yml'
      - 'scripts/test-ios-auth-contract.cjs'
      - 'scripts/test-ios-release-contract.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    # Standard Intel pool: arm64 capacity can cancel jobs before any test starts.
    # This is not a premium -large/-xlarge runner and does not change release signing.
    runs-on: macos-26-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Guard the passwordless social sign-in contract
        run: node --test scripts/test-ios-auth-contract.cjs
      - name: Guard release privacy, session, purchase and camera wiring
        run: node --test scripts/test-ios-release-contract.cjs
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test routing, session, billing, optional credentials and ticket projection policies
        run: swift test --package-path frontend-appstore
      - name: Ticket dates and filters must not depend on host timezone
        run: |
          set -e
          for zone in UTC Europe/Istanbul America/Los_Angeles; do
            TZ="$zone" swift test --package-path frontend-appstore --filter 'BusinessDateParserTests|TicketListTests'
          done
      - name: Compile app and UI test target for iOS Simulator
        run: |
          set -o pipefail
          if xcodebuild -project frontend-appstore/PusulaService.xcodeproj \
            -scheme PusulaService -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/pusula-derived CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee /tmp/pusula-ios-build.log; then
            exit 0
          fi
          # Surface compiler diagnostics on the run summary, without requiring
          # credentials or downloading the full build log for troubleshooting.
          while IFS= read -r diagnostic; do
            if [[ "$diagnostic" == *"error:"* ]]; then
              diagnostic="${diagnostic//%/%25}"
              diagnostic="${diagnostic//$'\r'/%0D}"
              printf '::error::%s\n' "$diagnostic"
            fi
          done < /tmp/pusula-ios-build.log
          exit 1
      - name: Compile clean Release and reject simulator-only diagnostic hooks
        run: |
          set -o pipefail
          xcodebuild -project frontend-appstore/PusulaService.xcodeproj \
            -scheme PusulaService -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/pusula-release CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/pusula-ios-release.log
          if strings /tmp/pusula-release/Build/Products/Release-iphonesimulator/PusulaService.app/PusulaService \
            | grep -E 'PUSULA_(CONNECTION_DIAGNOSTICS_FIXTURE|CUSTOMER_REFRESH_FIXTURE|TICKET_DETAIL_LOAD_FIXTURE|SOCIAL_AUTH_FIXTURE|TICKET_STRESS_COUNT)'; then
            echo '::error::A simulator-only regression hook is present in Release'
            exit 1
          fi
      - name: Regress login, refresh failures and 10000-ticket responsiveness on iPhone
        if: matrix.device == 'iPhone'
        run: |
          set -o pipefail
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          if xcodebuild -project frontend-appstore/PusulaService.xcodeproj \
            -scheme PusulaService -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath /tmp/pusula-derived CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath /tmp/pusula-ios-smoke.xcresult \
            -only-testing:PusulaServiceScreenshots/StartupSmokeTests \
            -only-testing:PusulaServiceScreenshots/AuthPresentationTests \
            -only-testing:PusulaServiceScreenshots/SocialSignInFlowTests \
            -only-testing:PusulaServiceScreenshots/TicketListPerformanceTests \
            -only-testing:PusulaServiceScreenshots/TicketDetailLoadTests \
            -only-testing:PusulaServiceScreenshots/CustomerRefreshTests \
            -only-testing:PusulaServiceScreenshots/ConnectionDiagnosticsPresentationTests \
            test-without-building 2>&1 | tee /tmp/pusula-ios-smoke.log; then
            exit 0
          fi
          while IFS= read -r diagnostic; do
            if [[ "$diagnostic" == *"error:"* || "$diagnostic" == *" failed"* ]]; then
              diagnostic="${diagnostic//%/%25}"
              diagnostic="${diagnostic//$'\r'/%0D}"
              printf '::error::%s\n' "$diagnostic"
            fi
          done < /tmp/pusula-ios-smoke.log
          exit 1
      - name: Regress Apple sign-in and refresh failures on iPad
        if: matrix.device == 'iPad'
        run: |
          set -o pipefail
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d.get("isAvailable") and d["name"].startswith("iPad")))')
          xcodebuild -project frontend-appstore/PusulaService.xcodeproj \
            -scheme PusulaService -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath /tmp/pusula-derived CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath /tmp/pusula-ios-social-ipad.xcresult \
            -only-testing:PusulaServiceScreenshots/SocialSignInFlowTests \
            -only-testing:PusulaServiceScreenshots/TicketDetailLoadTests \
            -only-testing:PusulaServiceScreenshots/CustomerRefreshTests \
            -only-testing:PusulaServiceScreenshots/ConnectionDiagnosticsPresentationTests \
            test-without-building 2>&1 | tee /tmp/pusula-ios-social-ipad.log
      - name: Export failed simulator attachments for diagnosis
        if: failure()
        run: |
          for result in /tmp/pusula-ios-*.xcresult; do
            [ -d "$result" ] || continue
            output="/tmp/pusula-ios-diagnostics/$(basename "$result" .xcresult)"
            mkdir -p "$output"
            xcrun xcresulttool get test-results summary --path "$result" > "$output/summary.json" || true
            xcrun xcresulttool export attachments --path "$result" --output-path "$output" --only-failures || true
          done
      - name: Retain simulator diagnostics when a gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-failure-${{ matrix.device }}-${{ github.run_id }}
          path: |
            /tmp/pusula-ios-*.log
            /tmp/pusula-ios-*.xcresult
            /tmp/pusula-ios-diagnostics
          retention-days: 7
          if-no-files-found: ignore
