name: iOS TestFlight (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only Apple access check, or archive and upload to TestFlight
        type: choice
        options: [preflight, upload]
        default: preflight
      build_number:
        description: Unused Apple build number (minimum 54; verified against Apple)
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: pusula-ios-testflight
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Define ephemeral release paths
        run: printf 'RELEASE_DIR=%s/pusula-ios-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Guard manual release tooling
        run: node --test scripts/test-ios-testflight.cjs
      - name: Require a passing iPhone and iPad gate for this iOS source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ios-release.cjs gate
      - name: Verify existing Apple credentials and current application
        id: apple
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          xcodebuild -version
          node scripts/ios-release.cjs preflight
      - name: Guard auth and release contracts
        if: inputs.operation == 'upload'
        run: node --test scripts/test-ios-auth-contract.cjs scripts/test-ios-release-contract.cjs
      - name: Test Swift policies
        if: inputs.operation == 'upload'
        run: swift test --package-path frontend-appstore
      - name: Create an isolated ephemeral signing keychain
        if: inputs.operation == 'upload'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RELEASE_DIR/ci-signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain"
          unset password
      - name: Archive current source with Apple automatic provisioning
        if: inputs.operation == 'upload'
        env:
          ASC_KEY_PATH: ${{ steps.apple.outputs.key_path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project frontend-appstore/PusulaService.xcodeproj \
            -scheme PusulaService -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RELEASE_DIR/PusulaService.xcarchive" \
            -derivedDataPath "$RELEASE_DIR/DerivedData" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM=DDV3HCZRP6 \
            CODE_SIGN_STYLE=Automatic archive > "$RELEASE_DIR/archive.log" 2>&1 || {
              # Print only actionable diagnostics, not provisioning/signing payloads.
              grep -E 'error:|ARCHIVE FAILED|No signing certificate|No profiles|maximum number' "$RELEASE_DIR/archive.log" || true
              exit 1
            }
          echo 'Release archive completed.'
      - name: Export with Apple cloud-managed distribution signing
        if: inputs.operation == 'upload'
        env:
          ASC_KEY_PATH: ${{ steps.apple.outputs.key_path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RELEASE_DIR/PusulaService.xcarchive" \
            -exportPath "$RELEASE_DIR/export" -exportOptionsPlist "$RELEASE_DIR/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RELEASE_DIR/export.log" 2>&1 || {
              grep -E 'error:|EXPORT FAILED|No signing certificate|No profiles|maximum number' "$RELEASE_DIR/export.log" || true
              exit 1
            }
          echo 'App Store export completed.'
      - name: Verify exported identity, entitlements and symbols
        if: inputs.operation == 'upload'
        run: python3 scripts/verify-ios-export.py
      - name: Upload the verified IPA (no review submission)
        if: inputs.operation == 'upload'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$RELEASE_DIR/private_keys"
          xcrun altool --upload-app --type ios --file "$RELEASE_DIR/export/PusulaService.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            > "$RELEASE_DIR/upload.log" 2>&1 || {
              grep -E 'Error:|ERROR|error:' "$RELEASE_DIR/upload.log" || true
              exit 1
            }
          echo 'Apple accepted the upload. Processing verification follows.'
      - name: Confirm Apple processing
        if: inputs.operation == 'upload'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node scripts/ios-release.cjs wait
      - name: Encrypt archive and dSYMs before artifact storage
        if: always() && inputs.operation == 'upload'
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node scripts/ios-release.cjs encrypt
      - name: Preserve only the encrypted recovery backup
        if: always() && inputs.operation == 'upload'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-encrypted-archive-${{ inputs.build_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pusula-ios-release/backup.pusula.enc
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 0
      - name: Remove ephemeral credentials and unencrypted release files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          security delete-keychain "$RELEASE_DIR/ci-signing.keychain-db" || true
          node -e 'const fs=require("node:fs"),p=require("node:path"); const root=p.resolve(process.env.RUNNER_TEMP); const dir=p.resolve(process.env.RELEASE_DIR); if(dir!==p.join(root,"pusula-ios-release")) throw new Error("Unexpected cleanup target"); fs.rmSync(dir,{recursive:true,force:true});'
