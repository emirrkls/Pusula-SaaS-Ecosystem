spring.application.name=pusula-backend
app.deploy.version=${APP_DEPLOY_VERSION:dev}
app.business.timezone=${APP_BUSINESS_TIMEZONE:Europe/Istanbul}

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/pusula_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20
spring.flyway.locations=classpath:db/migration
# spring.h2.console.enabled=true

# Multi-tenancy (Logical)
# We are using a discriminator column approach, so standard JPA handles it mostly,
# but we might need filters later.

# Security
# Provide JWT_SECRET via environment variables/secrets in all environments.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Server Configuration
server.port=8081

# Spring Boot 3.x Path Matching Configuration
# CRITICAL: Force AntPathMatcher for Spring Boot 2.x compatibility
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Disable PathPatternParser (Spring Boot 3.x default)
spring.mvc.path-pattern.use=false

# Prevent throwing exception when static resource not found
# CRITICAL: Disable automatic resource mappings - we define them explicitly in MvcConfig
# This prevents Spring Boot from adding a /** catchall handler that intercepts /api/** requests
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=false

# Logging Configuration
logging.level.org.springframework.context.annotation=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG
logging.level.org.springframework.boot.autoconfigure=INFO

# TRACE logging for handler mapping diagnostics
logging.level.org.springframework.web.servlet.handler=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.web.servlet.resource=DEBUG

# WhatsApp Notification Configuration
whatsapp.api.enabled=false
whatsapp.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.api.phone-id=${WHATSAPP_PHONE_ID:}
whatsapp.api.provider=META

# File Upload (Signature, PDF storage)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Iyzico Payment Configuration
iyzico.api.key=${IYZICO_API_KEY:sandbox-key}
iyzico.api.secret=${IYZICO_API_SECRET:sandbox-secret}
iyzico.base.url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
iyzico.callback.url=${IYZICO_CALLBACK_URL:http://168.231.104.133:8080/api/payment/webhook/iyzico}
iyzico.webhook.secret=${IYZICO_WEBHOOK_SECRET:}

# Google OAuth (Android sign in)
google.oauth.web-client-id=${GOOGLE_WEB_CLIENT_ID:}

# Google Play subscription verification
google.play.package-name=${GOOGLE_PLAY_PACKAGE_NAME:}
google.play.api-access-token=${GOOGLE_PLAY_API_ACCESS_TOKEN:}

# Apple App Store subscription verification
apple.app-store.bundle-id=${APPLE_APP_STORE_BUNDLE_ID:com.pusula.service}
apple.app-store.app-apple-id=${APPLE_APP_STORE_APP_APPLE_ID:}
apple.app-store.environments=${APPLE_APP_STORE_ENVIRONMENTS:SANDBOX,PRODUCTION}
apple.app-store.root-certificate-paths=${APPLE_APP_STORE_ROOT_CERTIFICATE_PATHS:}
apple.app-store.enable-online-checks=${APPLE_APP_STORE_ENABLE_ONLINE_CHECKS:true}

# Apple Push Notification service (APNs)
apple.push.enabled=${APPLE_PUSH_ENABLED:false}
apple.push.key-path=${APPLE_PUSH_KEY_PATH:}
apple.push.key-id=${APPLE_PUSH_KEY_ID:}
apple.push.team-id=${APPLE_PUSH_TEAM_ID:}
apple.push.bundle-id=${APPLE_PUSH_BUNDLE_ID:com.pusula.service}
apple.push.token-encryption-key=${PUSH_TOKEN_ENCRYPTION_KEY:}

# Desktop auto-update (MSI)
pusula.desktop.latest-version=3.4.7
pusula.desktop.download-url=https://api.pusulaiklimlendirme.com/downloads/Pusula-Servis-Yonetimi-3.4.7.msi
pusula.desktop.sha256=${PUSULA_DESKTOP_SHA256:4ff6dae7e67fa8eb056a32675c337baf5c6cb3032cad86c7dadac013ff01814a}
pusula.desktop.mandatory=false
pusula.desktop.release-notes=Teknisyen notlari ve garanti kapsaminda tahsilatsiz servis kapatma destegi eklendi.
