name: iOS Compile Gate

on:
  push:
    branches: [main]
    paths:
      - 'frontend-appstore/**'
      - '.github/workflows/ios-validation.yml'
  pull_request:
    paths:
      - 'frontend-appstore/**'
      - '.github/workflows/ios-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test notification routing and session-response policies
        run: swift test --package-path frontend-appstore
      - name: Compile app and UI test target for iOS Simulator
        run: |
          set -o pipefail
          if xcodebuild -project frontend-appstore/PusulaService.xcodeproj \
            -scheme PusulaService -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/pusula-derived CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee /tmp/pusula-ios-build.log; then
            exit 0
          fi
          # Surface compiler diagnostics on the run summary, without requiring
          # credentials or downloading the full build log for troubleshooting.
          while IFS= read -r diagnostic; do
            if [[ "$diagnostic" == *"error:"* ]]; then
              diagnostic="${diagnostic//%/%25}"
              diagnostic="${diagnostic//$'\r'/%0D}"
              printf '::error::%s\n' "$diagnostic"
            fi
          done < /tmp/pusula-ios-build.log
          exit 1
      - name: Smoke-test cold launch and foreground login on iPhone Simulator
        run: |
          set -o pipefail
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          if xcodebuild -project frontend-appstore/PusulaService.xcodeproj \
            -scheme PusulaService -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath /tmp/pusula-derived CODE_SIGNING_ALLOWED=NO \
            -only-testing:PusulaServiceScreenshots/StartupSmokeTests \
            test-without-building 2>&1 | tee /tmp/pusula-ios-smoke.log; then
            exit 0
          fi
          while IFS= read -r diagnostic; do
            if [[ "$diagnostic" == *"error:"* || "$diagnostic" == *" failed"* ]]; then
              diagnostic="${diagnostic//%/%25}"
              diagnostic="${diagnostic//$'\r'/%0D}"
              printf '::error::%s\n' "$diagnostic"
            fi
          done < /tmp/pusula-ios-smoke.log
          exit 1
