name: Android Validation

on:
  push:
    branches: [main]
    paths:
      - 'frontend-playstore/**'
      - '.github/workflows/android-validation.yml'
  pull_request:
    paths:
      - 'frontend-playstore/**'
      - '.github/workflows/android-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-playstore/PusulaService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests and compile debug application
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
